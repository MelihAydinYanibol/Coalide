<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Coalide — Veli Paneli</title>
<style>
  :root {
    --bg: #0d0d18;
    --surface: #16162a;
    --surface2: #1c1c33;
    --border: #2a2a45;
    --grid: #23233c;
    --purple: #7c5cff;
    --green: #42d6a4;
    --yellow: #f5c542;
    --red: #ff6b81;
    --blue: #5cc8ff;
    --ink: #ececf6;
    --ink2: #b8b8d4;
    --muted: #8686a8;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);

    /* Chart-mark steps. Same hues as the UI accents above, re-stepped so the
       three status marks that share a plot (doğru / yanlış / boş) stay apart
       under simulated colour-vision deficiency: worst all-pairs ΔE 9.3
       (deutan, OKLab x100) against this surface, up from 6.6 with the raw
       accent hexes. Validated with the data-viz palette validator. */
    --s-green: #41dca5;
    --s-red: #f9667a;
    --s-yellow: #f5c542;
    --s-purple: #7c5cff;
    --s-blue: #5cc8ff;

    --tap: 40px;   /* minimum comfortable touch target */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(124,92,255,.10), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(66,214,164,.07), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;   /* nothing may push the page sideways */
  }

  /* ---------- top bar ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(13,13,24,.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 10px max(14px, env(safe-area-inset-left)) 10px max(14px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 11px; min-width: 0;
    color: inherit; text-decoration: none; border-radius: 10px;
    padding: 2px 4px; margin: -2px -4px; transition: background .15s;
  }
  .brand:hover { background: rgba(124,92,255,.12); }
  .brand:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--purple), #b79bff);
    display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 4px 14px rgba(124,92,255,.4);
  }
  .brand .t { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  .brand .s { font-size: 11px; color: var(--muted); margin-top: -2px; }
  .spacer { flex: 1 1 auto; }
  .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ctl label { font-size: 12px; color: var(--muted); flex: none; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .actions a { text-decoration: none; }
  select, button {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
    min-height: var(--tap);
    transition: border-color .15s, background .15s;
  }
  select { max-width: 100%; text-overflow: ellipsis; }
  select:hover, button:hover { border-color: var(--purple); }
  select:focus-visible, button:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--purple); outline-offset: 2px;
  }
  button:active { transform: translateY(1px); }
  .updated { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); flex: none; }

  @media (max-width: 720px) {
    .spacer { display: none; }
    .actions { margin-left: auto; }
    .ctl { order: 3; flex: 1 1 100%; }
    .ctl select { flex: 1 1 auto; }
    .updated { order: 4; flex: 1 1 100%; }
    .brand .s { display: none; }
  }

  /* ---------- layout ---------- */
  main {
    max-width: 1240px; margin: 0 auto;
    padding: 20px max(14px, env(safe-area-inset-left)) 56px max(14px, env(safe-area-inset-right));
  }

  .tabs {
    display: flex; gap: 8px; margin-bottom: 20px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity; padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; white-space: nowrap; scroll-snap-align: start;
    padding: 9px 15px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink2); cursor: pointer; font-size: 13px;
    font-weight: 600; transition: all .15s; min-height: var(--tap);
  }
  .tab:hover { border-color: var(--purple); color: var(--ink); }
  .tab.active { color: #fff; background: linear-gradient(135deg, var(--purple), #9a7dff); border-color: transparent; box-shadow: 0 4px 14px rgba(124,92,255,.35); }
  section.page { display: none; }
  section.page.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    section.page.active { animation: none; }
    * { transition-duration: .01ms !important; }
  }

  /* 12-column grid. minmax(0,1fr) so a wide child (table, chart) scrolls
     inside its card instead of stretching the whole column. */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .col-1 { grid-column: span 1; }   .col-2 { grid-column: span 2; }
  .col-3 { grid-column: span 3; }   .col-4 { grid-column: span 4; }
  .col-5 { grid-column: span 5; }   .col-6 { grid-column: span 6; }
  .col-7 { grid-column: span 7; }   .col-8 { grid-column: span 8; }
  .col-9 { grid-column: span 9; }   .col-10 { grid-column: span 10; }
  .col-11 { grid-column: span 11; } .col-12 { grid-column: span 12; }
  /* Cards in the same row share a height. */
  .grid > [class*="col-"] { display: flex; min-width: 0; }
  .grid > [class*="col-"] > .card { flex: 1 1 auto; min-width: 0; }

  @media (max-width: 1024px) {
    .grid { gap: 14px; }
    .col-3, .col-4, .col-5 { grid-column: span 6; }
    .col-7, .col-8, .col-9, .col-10, .col-11 { grid-column: span 12; }
  }
  @media (max-width: 640px) {
    .grid { gap: 12px; }
    [class*="col-"] { grid-column: span 12 !important; }
  }

  .card {
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .card > .h { display: flex; align-items: baseline; gap: 8px 12px; margin-bottom: 2px; }
  .card > .h .ht { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; min-width: 0; }
  .card .title { font-size: 14px; font-weight: 700; }
  .card .sub { font-size: 11.5px; color: var(--muted); }
  .card .hact { margin-left: auto; flex: none; align-self: center; }
  /* Cards in a row share a height; the body distributes the slack so a short
     card centres its content instead of hanging off the top. */
  .card .body { margin-top: 12px; flex: 1 1 auto; min-width: 0; min-height: 0;
                display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .card .body > .table-wrap { min-height: 0; }
  @media (max-width: 640px) { .card { padding: 14px; border-radius: 14px; } }

  /* ghost toggle in a card header */
  .tgl {
    min-height: 28px; padding: 4px 10px; font-size: 11.5px; font-weight: 600;
    border-radius: 999px; background: transparent; color: var(--muted);
    border: 1px solid var(--border);
  }
  .tgl:hover { color: var(--ink); }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .kpis.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; position: relative; overflow: hidden; }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, var(--purple)); }
  .kpi .l { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .kpi .v { font-size: clamp(22px, 5.4vw, 27px); font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
  .kpi .u { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; }
  @media (max-width: 400px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--ink2); }
  .legend .it { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .legend .sw.line { width: 15px; height: 3px; border-radius: 2px; }
  .legend .mk { color: var(--muted); font-weight: 700; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 13.5px; align-items: baseline; }
  .kv .k { color: var(--muted); } .kv .v { font-weight: 600; text-align: right; }
  .note { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
  .empty { color: var(--muted); font-style: italic; padding: 20px 0; text-align: center; }

  /* hardest words */
  .hrow { display: grid; grid-template-columns: minmax(0, 1fr) 52px 96px; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
  .hrow:last-child { border-bottom: 0; }
  .hrow .w { font-weight: 700; overflow-wrap: anywhere; }
  .hrow .track { grid-column: 1 / -1; height: 6px; background: var(--grid); border-radius: 4px; overflow: hidden; margin-top: -2px; }
  .hrow .fill { height: 100%; border-radius: 4px; }
  .hrow .pct { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hrow .cnt { text-align: right; font-size: 12px; color: var(--ink2); white-space: nowrap; }

  /* progress ring block */
  .ringwrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .ringwrap .ring { flex: none; }
  .ringwrap .meta { flex: 1 1 220px; min-width: 0; }
  @media (max-width: 480px) { .ringwrap { justify-content: center; } }

  /* tables */
  .table-wrap { max-height: 560px; overflow: auto; border-radius: 12px; border: 1px solid var(--border); -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--surface2); color: var(--muted); user-select: none; font-weight: 600; z-index: 1; }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--ink); }
  tbody tr:hover { background: rgba(124,92,255,.06); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 12px; }

  /* answer-log day picker */
  .daybar, .rangebar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
  /* label + input stay together when the row wraps */
  .rangebar .fld { display: flex; align-items: center; gap: 8px; }
  .rangebar .lbl { font-size: 11.5px; color: var(--muted); }
  .daybar input[type="date"], .rangebar input[type="date"] {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 12px; font: inherit; font-size: 13px;
    min-height: var(--tap); color-scheme: dark; cursor: pointer;
  }
  .daybar input[type="date"]:hover, .rangebar input[type="date"]:hover { border-color: var(--purple); }
  .daybar .nav { padding: 8px 13px; font-size: 15px; line-height: 1; }
  .daybar .hint { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink2); font-size: 12px; font-weight: 600;
    cursor: pointer; min-height: 30px;
  }
  .chip:hover { border-color: var(--purple); color: var(--ink); }
  .chip[aria-pressed="true"] { background: rgba(124,92,255,.20); border-color: var(--purple); color: var(--ink); }
  td.wrap, th.wrap { white-space: normal; min-width: 110px; overflow-wrap: anywhere; }
  /* On a phone the time gets its own line under the question, so the columns
     that matter — what was asked and what the child answered — fit on screen. */
  .t-sm { display: none; }
  @media (max-width: 640px) {
    .c-time { display: none; }
    .t-sm { display: block; font-size: 11px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.05); white-space: nowrap; }
  .given-wrong { color: var(--red); }
  .given-empty { color: var(--muted); font-style: italic; }

  /* meter (price tariff) */
  .meter { margin: 10px 0; padding-left: 10px; border-left: 2px solid transparent; }
  .meter.now { border-left-color: var(--yellow); }
  .meter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; margin-bottom: 5px; }
  .meter .top .rate { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter.now .top .rate { color: var(--yellow); }
  .meter .tag { font-size: 10.5px; font-weight: 700; color: var(--bg); background: var(--yellow); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  .meter .track { height: 9px; background: var(--grid); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 5px; background: var(--s-yellow); }

  /* charts */
  .chart-host { width: 100%; min-width: 0; flex: 1 1 auto; min-height: 190px; }
  svg.chart { display: block; max-width: 100%; overflow: visible; touch-action: pan-y; }
  .ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .dlabel { font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .hit { fill: transparent; }
  .crosshair { stroke: var(--muted); stroke-width: 1; pointer-events: none; opacity: 0; }

  /* tooltip */
  #tip {
    position: fixed; z-index: 100; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%); transition: opacity .1s;
    background: rgba(20,20,36,.97); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 11px; box-shadow: var(--shadow);
    font-size: 12.5px; min-width: 120px; max-width: min(260px, 88vw);
    backdrop-filter: blur(4px);
  }
  #tip.below { transform: translate(-50%, 0); }
  #tip .tt { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  #tip .tr { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #tip .tr .k { display: flex; align-items: center; gap: 6px; color: var(--ink2); }
  #tip .tr .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  #tip .tr .sw.line { width: 13px; height: 3px; }
  #tip .tr .val { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }

  #banner-msg { text-align: center; padding: 72px 20px; color: var(--muted); font-size: 15px; }
  /* refetch must not flash a skeleton — hold the old render, dimmed */
  #content.stale { opacity: .55; transition: opacity .15s; }
</style>
</head>
<body data-palette="#41dca5,#f9667a,#f5c542" data-mode="dark">
<header>
  <a class="brand" href="/" title="Ana sayfaya dön">
    <div class="logo">🌍</div>
    <div><div class="t">COALIDE</div><div class="s">Veli Paneli</div></div>
  </a>
  <div class="spacer"></div>
  <div class="ctl">
    <label for="user">Öğrenci</label>
    <select id="user"></select>
  </div>
  <div class="actions">
    <button id="refresh" title="Yenile">🔄 Yenile</button>
    <a href="/admin"><button id="admin-btn" title="Yönetim">🛠️ Yönetim</button></a>
  </div>
  <div class="updated" id="updated"></div>
</header>

<main>
  <div id="banner-msg">Yükleniyor…</div>
  <div id="content" style="display:none">
    <div class="tabs" id="tabs"></div>
    <section class="page" data-page="genel"></section>
    <section class="page" data-page="kredi"></section>
    <section class="page" data-page="hafta"></section>
    <section class="page" data-page="kelime"></section>
    <section class="page" data-page="gelecek"></section>
  </div>
</main>
<div id="tip"></div>

<script>
"use strict";
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const C = {
  purple: css('--s-purple'), green: css('--s-green'), yellow: css('--s-yellow'),
  red: css('--s-red'), blue: css('--s-blue'), muted: css('--muted'),
  ink: css('--ink'), ink2: css('--ink2'), grid: css('--grid'), surface: css('--surface'),
};
// Ordinal single-hue ramp (dark -> light) for the ORDERED maturity buckets.
// Stepped for this dark surface: monotone lightness, >=0.06 OKLCH ΔL between
// steps, darkest step clears 2:1 against the surface.
const PURPLE_SEQ = ['#6c21c0', '#8133e0', '#9353ef', '#a56ffe', '#b590fd', '#c6affb'];
const MATURE = 21, CREDITS_PER_CORRECT = 7;
const TR_MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

// ---------- DOM helpers ----------
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function txt(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function num(v) { return (v == null || isNaN(v)) ? 0 : +v; }
function rateColor(r) { return r >= 80 ? C.green : r >= 50 ? C.yellow : C.red; }
function fmtNum(v) { v = num(v); return Number.isInteger(v) ? v.toLocaleString("tr-TR") : v.toFixed(v < 1 ? 2 : 1); }
// Pick the smallest 1/2/5-style step that keeps the gridline count sane, so
// every tick is a whole number (never 12.5 / 37.5) and the top of the axis
// sits just above the data.
function niceScale(m, maxTicks = 6) {
  if (!(m > 0)) return { ymax: 1, ticks: 1 };
  const p0 = Math.floor(Math.log10(m)) - 2;
  for (let e = p0; e < p0 + 8; e++) {
    for (const mult of [1, 2, 5]) {
      const step = mult * Math.pow(10, e);
      if (step <= 0) continue;
      const ticks = Math.ceil(m / step - 1e-9);
      if (ticks >= 2 && ticks <= maxTicks) return { ymax: step * ticks, ticks };
    }
  }
  return { ymax: m, ticks: 4 };
}
function dayLabel(d) { return `${d.getDate()} ${TR_MONTHS[d.getMonth()]}`; }
// Format a Date as YYYY-MM-DD in local time. toISOString() would convert to
// UTC first and land on the wrong day for anyone east or west of it.
function isoOf(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function shiftISO(s, days) { const d = parseISO(s); d.setDate(d.getDate() + days); return isoOf(d); }
function longDate(s) { const d = parseISO(s); return `${d.getDate()} ${TR_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function backLabels(todayStr, n) { const out = []; const t = new Date(todayStr + "T00:00:00"); for (let i = n - 1; i >= 0; i--) { const d = new Date(t); d.setDate(t.getDate() - i); out.push(dayLabel(d)); } return out; }

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function placeTip(x, y) {
  const w = tip.offsetWidth || 140, h = tip.offsetHeight || 60, pad = 8;
  const below = (y - h - 12) < pad;
  tip.classList.toggle("below", below);
  const left = Math.min(Math.max(x, w / 2 + pad), window.innerWidth - w / 2 - pad);
  const top = below ? Math.min(y + 14, window.innerHeight - h - pad) : y - 10;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function showTip(title, rows, x, y) {
  tip.replaceChildren();
  tip.appendChild(txt("div", "tt", title));
  for (const r of rows) {
    const tr = el("div", "tr");
    const k = el("div", "k");
    const sw = el("span", "sw" + (r.line ? " line" : "")); sw.style.background = r.color;
    k.appendChild(sw);
    k.appendChild(txt("span", null, (r.mark ? r.mark + " " : "") + r.name));
    tr.appendChild(k);
    tr.appendChild(txt("span", "val", r.value));
    tip.appendChild(tr);
  }
  tip.style.opacity = 1;
  placeTip(x, y);
}
function hideTip() { tip.style.opacity = 0; }
window.addEventListener("scroll", hideTip, { passive: true });

// ---------- cards ----------
function card(title, sub, cls) {
  const c = el("div", "card " + (cls || ""));
  const h = el("div", "h");
  const ht = el("div", "ht");

//  CHART PRIMITIVES (inline SVG, no dependencies)
// =====================================================================
// Charts are drawn at their container's real pixel width, so one viewBox unit
// is one CSS pixel: axis labels stay 11px whether the card is 320px or 900px
// wide. A shared ResizeObserver redraws them when the column reflows.
const _ro = new ResizeObserver(entries => { for (const e of entries) e.target._draw && e.target._draw(); });

// build(width, height) — `height` is the slack the card can give the plot, so a
// chart in a tall row grows instead of leaving the card bottom empty.
function chartHost(build) {
  const host = el("div", "chart-host");
  let lastW = 0, lastH = 0;
  host._draw = () => {
    const w = Math.round(host.clientWidth), h = Math.round(host.clientHeight);
    if (!w || (Math.abs(w - lastW) < 8 && Math.abs(h - lastH) < 12)) return;
    lastW = w; lastH = h;
    try { host.replaceChildren(build(Math.max(240, w), h)); }
    catch (err) { host.replaceChildren(el("div", "empty", "Grafik çizilemedi.")); console.error(err); }
  };
  _ro.observe(host);
  return host;
}
// Draw exactly into the slack the host was given (clamped), so the SVG never

function autoHeight(w, avail, min = 190, max = 340) {
  if (!avail || avail < min) return Math.max(min, Math.min(max, Math.round(w * 0.46)));
  return Math.max(min, Math.min(max, Math.round(avail)));
}
// How many x labels fit without colliding, given the widest label.
function labelStep(n, plotW, labels) {
  const widest = labels.reduce((a, l) => Math.max(a, String(l).length), 0) * 7.2 + 20;
  return Math.max(1, Math.ceil(n / Math.max(1, Math.floor(plotW / widest))));
}
function axisPadL(ymax, valueFmt) { return Math.max(30, String(valueFmt(Math.round(ymax))).length * 7 + 14); }

// Line / area chart with crosshair, all-series tooltip and a direct end label.
function lineChart(opts) {
  const { width, avail, labels, series, area = false, valueFmt = fmtNum } = opts;
  const H = opts.height || autoHeight(width, avail);
  const n = labels.length;
  if (!n) return el("div", "empty", "Veri yok.");
  const allVals = series.flatMap(se => se.values.map(num));
  const { ymax, ticks } = niceScale(Math.max(1, ...allVals));
  const padL = axisPadL(ymax, valueFmt), padR = 34, padT = 14, padB = 26;
  const plotW = Math.max(40, width - padL - padR), plotH = H - padT - padB;
  const X = i => padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const Y = v => padT + plotH - (num(v) / ymax) * plotH;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${width} ${H}`, width, height: H });

  for (let t = 0; t <= ticks; t++) {
    const v = ymax * t / ticks, y = Y(v);
    svg.appendChild(s("line", { class: "gridline", x1: padL, y1: y, x2: width - padR, y2: y }));
    const lbl = s("text", { class: "ax", x: padL - 8, y: y + 4, "text-anchor": "end" });
    lbl.textContent = valueFmt(Math.round(v)); svg.appendChild(lbl);
  }
  const step = labelStep(n, plotW, labels);
  for (let i = 0; i < n; i += step) {
    const tx = s("text", { class: "ax", x: X(i), y: H - 8, "text-anchor": i === 0 ? "start" : "middle" });
    tx.textContent = labels[i]; svg.appendChild(tx);
  }
  for (const se of series) {
    const pts = se.values.map((v, i) => [X(i), Y(v)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    if (area && series.length === 1) {
      svg.appendChild(s("path", { d: d + ` L ${X(n - 1).toFixed(1)} ${Y(0)} L ${X(0).toFixed(1)} ${Y(0)} Z`, fill: se.color, "fill-opacity": .12, stroke: "none" }));
    }
    svg.appendChild(s("path", { d, fill: "none", stroke: se.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const lx = X(n - 1), ly = Y(se.values[n - 1]);
    svg.appendChild(s("circle", { cx: lx, cy: ly, r: 4, fill: se.color, stroke: C.surface, "stroke-width": 2 }));
    // selective direct label: the endpoint only
    const t = s("text", { class: "dlabel", x: Math.min(lx + 7, width - 2), y: ly + 4, "text-anchor": "start", fill: se.color });
    t.textContent = valueFmt(num(se.values[n - 1])); svg.appendChild(t);
  }
  const cross = s("line", { class: "crosshair", y1: padT, y2: padT + plotH });
  svg.appendChild(cross);
  const dots = series.map(se => { const c = s("circle", { r: 4, fill: se.color, stroke: C.surface, "stroke-width": 2, opacity: 0 }); svg.appendChild(c); return c; });
  const hit = s("rect", { class: "hit", x: padL, y: padT, width: plotW, height: plotH });
  svg.appendChild(hit);
  hit.addEventListener("pointermove", ev => {
    const rect = svg.getBoundingClientRect();
    const vx = (ev.clientX - rect.left) / rect.width * width;
    let i = Math.round((vx - padL) / plotW * (n - 1)); i = Math.max(0, Math.min(n - 1, i));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
    dots.forEach((dot, k) => { dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(series[k].values[i])); dot.setAttribute("opacity", 1); });
    const topY = Math.min(...series.map(se => Y(se.values[i])));
    showTip(labels[i], series.map(se => ({ color: se.color, name: se.name, mark: se.mark, value: valueFmt(num(se.values[i])), line: true })),
            rect.left + X(i) / width * rect.width, rect.top + topY / H * rect.height);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); dots.forEach(d => d.setAttribute("opacity", 0)); hideTip(); });
  return svg;
}

// Column chart — single or grouped series, with full-height hover bands so the
// hit target never shrinks to the width of a thin bar.
function columnChart(opts) {
  const { width, avail, labels, series, valueFmt = fmtNum, colorsPerBar = null, emphasis = null } = opts;
  const H = opts.height || autoHeight(width, avail);
  const n = labels.length, g = series.length;
  if (!n) return el("div", "empty", "Veri yok.");
  const allVals = series.flatMap(se => se.values.map(num));
  const { ymax, ticks } = niceScale(Math.max(1, ...allVals));
  const padL = axisPadL(ymax, valueFmt), padR = 12, padT = 14, padB = 28;
  const plotW = Math.max(40, width - padL - padR), plotH = H - padT - padB;
  const Y = v => padT + plotH - (num(v) / ymax) * plotH;
  const band = plotW / n;
  const groupW = band - Math.min(band * 0.28, 12);
  const gap = 2;                                     // surface gap between bars
  const barW = Math.max(2, Math.min((groupW - gap * (g - 1)) / g, 26));
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${width} ${H}`, width, height: H });

  for (let t = 0; t <= ticks; t++) {
    const v = ymax * t / ticks, y = Y(v);
    svg.appendChild(s("line", { class: "gridline", x1: padL, y1: y, x2: width - padR, y2: y }));
    const lbl = s("text", { class: "ax", x: padL - 8, y: y + 4, "text-anchor": "end" });
    lbl.textContent = valueFmt(Math.round(v)); svg.appendChild(lbl);
  }
  const step = labelStep(n, plotW, labels);
  const bars = [];
  for (let i = 0; i < n; i++) {
    const cx = padL + band * i + band / 2;
    if (i % step === 0) { const tx = s("text", { class: "ax", x: cx, y: H - 9, "text-anchor": "middle" }); tx.textContent = labels[i]; svg.appendChild(tx); }
    const groupStart = cx - (barW * g + gap * (g - 1)) / 2;
    const row = [];
    series.forEach((se, k) => {
      const v = num(se.values[i]);
      const h = Math.max(0, (v / ymax) * plotH);
      if (h <= 0) { row.push(null); return; }
      const x = groupStart + k * (barW + gap), y = Y(v);
      const color = colorsPerBar ? colorsPerBar[i] : se.color;
      const r = Math.min(4, barW / 2, h);
      const bar = s("path", {
        d: `M${x} ${y + r} a${r} ${r} 0 0 1 ${r} ${-r} h${barW - 2 * r} a${r} ${r} 0 0 1 ${r} ${r} v${h - r} h${-barW} Z`,
        fill: color,
      });
      svg.appendChild(bar); row.push(bar);
    });
    bars.push(row);
    const emp = emphasis && emphasis.find(e => e.index === i);
    if (emp) {
      const v = num(series[0].values[i]);
      const label = emp.label != null ? emp.label : valueFmt(v);
      // keep the label inside the plot so it never sits on the y-axis ticks
      const half = label.length * 3.4 + 2;
      const lx = Math.max(padL + half, Math.min(width - padR - half, cx));
      const t = s("text", { class: "dlabel", x: lx, y: Y(v) - 7, "text-anchor": "middle", fill: colorsPerBar ? colorsPerBar[i] : series[0].color });
      t.textContent = label;
      svg.appendChild(t);
    }
  }
  // hover bands (>=24px where the data allows) drawn last, above the bars
  for (let i = 0; i < n; i++) {
    const hb = s("rect", { class: "hit", x: padL + band * i, y: padT, width: band, height: plotH });
    hb.addEventListener("pointerenter", () => bars[i].forEach(b => b && b.setAttribute("opacity", .75)));
    hb.addEventListener("pointermove", ev => {
      const rect = svg.getBoundingClientRect();
      const topY = Math.min(...series.map(se => Y(se.values[i])));
      showTip(labels[i], series.map(se => ({ color: colorsPerBar ? colorsPerBar[i] : se.color, name: se.name, mark: se.mark, value: valueFmt(num(se.values[i])) })),
              rect.left + (padL + band * i + band / 2) / width * rect.width, rect.top + topY / H * rect.height);
    });
    hb.addEventListener("pointerleave", () => { bars[i].forEach(b => b && b.setAttribute("opacity", 1)); hideTip(); });
    svg.appendChild(hb);
  }
  return svg;
}

// Stacked-100% horizontal distribution bar with the ordinal ramp.

// Donut with hover + center total.
function donut(opts) {
  const { segments, centerValue, centerLabel, size = 190 } = opts;
  const total = segments.reduce((a, x) => a + num(x.value), 0);
  const r = size / 2, cx = r, cy = r, thick = size * 0.19, rr = r - thick / 2;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${size} ${size}`, width: size, height: size });
  if (total <= 0) {
    svg.appendChild(s("circle", { cx, cy, r: rr, fill: "none", stroke: C.grid, "stroke-width": thick }));
  } else {
    let a0 = -Math.PI / 2;
    const gap = 0.03;
    segments.forEach(seg => {
      const v = num(seg.value); if (v <= 0) return;
      const frac = v / total, a1 = a0 + frac * Math.PI * 2;
      const s0 = a0 + gap / 2, s1 = a1 - gap / 2;
      const large = (s1 - s0) > Math.PI ? 1 : 0;
      const x0 = cx + rr * Math.cos(s0), y0 = cy + rr * Math.sin(s0);
      const x1 = cx + rr * Math.cos(s1), y1 = cy + rr * Math.sin(s1);
      const path = s("path", { d: `M${x0} ${y0} A${rr} ${rr} 0 ${large} 1 ${x1} ${y1}`, fill: "none", stroke: seg.color, "stroke-width": thick });
      const show = ev => { path.setAttribute("stroke-width", thick + 5); showTip(seg.name, [{ color: seg.color, name: "Adet", mark: seg.mark, value: fmtNum(v) + `  (%${(frac * 100).toFixed(0)})` }], ev.clientX, ev.clientY); };
      path.addEventListener("pointerenter", show);
      path.addEventListener("pointermove", show);
      path.addEventListener("pointerleave", () => { path.setAttribute("stroke-width", thick); hideTip(); });
      svg.appendChild(path);
      a0 = a1;
    });
  }

  const inner = (rr - thick / 2) * 2 * 0.92;
  const fs = Math.min(size * 0.2, inner / Math.max(3, String(centerValue).length) * 1.75);
  const t1 = s("text", { x: cx, y: cy - 2, "text-anchor": "middle", fill: C.ink, "font-size": fs, "font-weight": 800 }); t1.textContent = centerValue;
  const t2 = s("text", { x: cx, y: cy + size * 0.13, "text-anchor": "middle", fill: C.muted, "font-size": size * 0.075 }); t2.textContent = centerLabel;
  svg.appendChild(t1); svg.appendChild(t2);
  return svg;
}

// Progress ring (single value, status colour).

// Genel Başarı — all time by default, with preset and custom windows summed
// from the per-day breakdown the client ships.

    // weeks start Monday, matching the client's own week bucketing

    case "month": return [`${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-01`, today];
    default: return [null, null];
  }

function successCard(st) {
  const lt = st.log_totals || {};
  const byDate = st.answers_by_date;
  const c = card("Genel Başarı", "");
  const today = st.today;

  // Older clients don't send the per-day breakdown — show all-time only.
  if (!byDate || typeof byDate !== "object") {
    c._ht.appendChild(txt("div", "sub", "tüm kayıtlı cevaplara göre"));
    c._body.appendChild(successBody(st, {
      correct: num(lt.correct), wrong: num(lt.wrong), blank: num(lt.blank),
    }, num(st.overall_rate)));
    return c;
  }

  const sub = txt("div", "sub", "");
  c._ht.appendChild(sub);

  const chips = el("div", "chips");
  const custom = el("div", "rangebar");
  custom.style.display = "none";
  const from = document.createElement("input"), to = document.createElement("input");
  from.type = to.type = "date";
  const dates = Object.keys(byDate).sort();
  if (dates.length) { from.min = to.min = dates[0]; from.max = to.max = today; }
  _range.from = _range.from || dates[0] || today;
  _range.to = _range.to || today;
  from.value = _range.from; to.value = _range.to;
  const field = (label, input) => { const f = el("div", "fld"); f.append(txt("span", "lbl", label), input); return f; };
  custom.append(field("Başlangıç", from), field("Bitiş", to));

  const body = el("div");
  c._body.append(chips, custom, body);

  const chipEls = RANGE_PRESETS.map(([key, label]) => {
    const b = txt("button", "chip", label);
    b.setAttribute("aria-pressed", String(key === _range.key));
    b.onclick = () => {
      _range.key = key;
      chipEls.forEach((e, i) => e.setAttribute("aria-pressed", String(RANGE_PRESETS[i][0] === key)));
      render();
    };
    chips.appendChild(b);
    return b;
  });
  from.onchange = to.onchange = () => {
    if (from.value && to.value && from.value > to.value) { const v = from.value; from.value = to.value; to.value = v; }
    _range.from = from.value; _range.to = to.value;
    render();
  };

  function render() {
    custom.style.display = _range.key === "custom" ? "" : "none";
    const [lo, hi] = _range.key === "custom" ? [_range.from, _range.to] : rangeBounds(_range.key, today);
    let correct = 0, wrong = 0, blank = 0;
    for (const d in byDate) {
      if ((lo && d < lo) || (hi && d > hi)) continue;
      const v = byDate[d] || [];
      correct += num(v[0]); wrong += num(v[1]); blank += num(v[2]);

    // pre-log answers folded into overall_rate.
    const rate = _range.key === "all" && !total ? num(st.overall_rate)

      : (lo === hi ? longDate(lo) : `${longDate(lo)} – ${longDate(hi)}`);
    body.replaceChildren(successBody(st, { correct, wrong, blank }, rate, total === 0));
  }
  render();
  return c;
}
function successBody(st, counts, rate, empty) {

  ], "pair"));
  if (empty) meta.appendChild(txt("p", "note", "Bu aralıkta kayıtlı cevap yok."));
  ring.appendChild(meta);
  return ring;
}

// Per-day answer log: pick a date, see every question asked that day, what the
// child typed and how it was graded. Defaults to today.
const RESULT_META = {
  correct: { mark: "✓", name: "Doğru", color: C.green },
  wrong: { mark: "✗", name: "Yanlış", color: C.red },
  blank: { mark: "∅", name: "Boş", color: C.yellow },
};
let _logFilter = "all";
function answerLogCard(st) {
  const c = card("Cevap Günlüğü", "seçilen günde sorulan sorular ve verilen cevaplar");
  const log = st.answer_log;
  if (!Array.isArray(log)) {
    c._body.appendChild(el("div", "empty",
      "Cevap detayları bu kayıtta yok. Çocuğun Coalide uygulaması güncellendikten sonra, " +
      "sonraki sorulardan itibaren burada görünecek."));
    return c;
  }

  const byDate = new Map();
  for (const r of log) {
    if (!byDate.has(r.date)) byDate.set(r.date, []);
    byDate.get(r.date).push(r);
  }
  const dates = [...byDate.keys()].sort();
  const today = st.today;
  let day = byDate.has(today) ? today : (dates[dates.length - 1] || today);

  // --- controls -------------------------------------------------------
  const bar = el("div", "daybar");
  const prev = txt("button", "nav", "‹"); prev.title = "Önceki gün";
  const input = document.createElement("input");
  input.type = "date"; input.value = day;
  if (dates.length) { input.min = dates[0]; input.max = today > dates[dates.length - 1] ? today : dates[dates.length - 1]; }
  const next = txt("button", "nav", "›"); next.title = "Sonraki gün";
  const todayBtn = txt("button", "tgl", "Bugün");
  bar.append(prev, input, next, todayBtn);
  bar.appendChild(txt("div", "hint", `son ${num(st.answer_log_days) || 30} günün kaydı · ${dates.length} günde veri var`));
  c._body.appendChild(bar);

  const chips = el("div", "chips");
  const filters = [["all", "Tümü"], ["correct", "✓ Doğru"], ["wrong", "✗ Yanlış"], ["blank", "∅ Boş"]];
  const chipEls = filters.map(([key, label]) => {
    const b = txt("button", "chip", label);
    b.setAttribute("aria-pressed", String(key === _logFilter));
    b.onclick = () => { _logFilter = key; chipEls.forEach((e, i) => e.setAttribute("aria-pressed", String(filters[i][0] === key))); render(); };
    chips.appendChild(b);
    return b;
  });
  c._body.appendChild(chips);

  const summary = el("div");
  const body = el("div");
  c._body.appendChild(summary);
  c._body.appendChild(body);

  // --- render ---------------------------------------------------------
  function render() {
    const all = byDate.get(day) || [];
    const counts = { correct: 0, wrong: 0, blank: 0 };
    all.forEach(r => { if (counts[r.result] != null) counts[r.result]++; });
    const total = all.length;
    const rate = total ? counts.correct / total * 100 : 0;

    summary.replaceChildren(kpiRow([
      { label: "Toplam soru", value: total, color: C.purple },
      { label: "Doğru ✓", value: counts.correct, color: C.green },
      { label: "Yanlış ✗", value: counts.wrong, color: C.red },
      { label: "Boş ∅", value: counts.blank, color: C.yellow },
      { label: "Başarı", value: Math.round(rate), unit: "%", color: rateColor(rate) },
    ]));

    const rows = _logFilter === "all" ? all : all.filter(r => r.result === _logFilter);
    body.replaceChildren();
    if (!total) {
      body.appendChild(el("div", "empty", "Bu tarihte kayıtlı cevap yok."));
      return;
    }
    if (!rows.length) {
      body.appendChild(el("div", "empty", "Bu filtreye uyan cevap yok."));
      return;
    }

    const wrap = el("div", "table-wrap");
    const table = el("table"), thead = el("thead"), htr = el("tr");
    [["Saat", "c-time"], ["Soru", "wrap"], ["Beklenen cevap", "wrap"], ["Çocuğun cevabı", "wrap"], ["Sonuç", ""]]
      .forEach(([label, cls]) => htr.appendChild(txt("th", cls, label)));
    thead.appendChild(htr); table.appendChild(thead);
    const tbody = el("tbody");
    for (const r of rows) {
      const meta = RESULT_META[r.result] || { mark: "?", name: r.result, color: C.muted };
      const tr = el("tr");
      tr.appendChild(txt("td", "c-time", r.time || "—")).style.color = C.muted;
      // Older log rows predate the detail columns — all we have is the word.
      const q = el("td", "wrap");
      q.appendChild(txt("span", null, r.prompt || r.word)).style.fontWeight = 700;
      if (r.time) q.appendChild(txt("span", "t-sm", r.time));
      tr.appendChild(q);
      tr.appendChild(txt("td", "wrap", r.expected || "—"));
      const given = el("td", "wrap");
      if (r.result === "blank" || !r.given) {
        given.appendChild(txt("span", "given-empty", r.result === "blank" ? "(boş bırakıldı)" : "—"));
      } else {
        const g = txt("span", r.result === "wrong" ? "given-wrong" : null, r.given);
        given.appendChild(g);
      }
      tr.appendChild(given);
      const res = el("td");
      const badge = txt("span", "badge", `${meta.mark} ${meta.name}`);
      badge.style.color = meta.color;
      res.appendChild(badge);
      tr.appendChild(res);
      tbody.appendChild(tr);
    }
    table.appendChild(tbody); wrap.appendChild(table);
    body.appendChild(wrap);
    if (rows.some(r => !r.prompt && !r.expected)) {
      body.appendChild(txt("p", "note",
        "Bazı satırlarda soru ve cevap detayı yok: bunlar uygulama güncellenmeden önce kaydedilmiş, " +
        "o zaman yalnızca kelime ve sonuç tutuluyordu."));
    }
  }

  function goto(d) { day = d; input.value = d; render(); }
  const shift = n => goto(shiftISO(day, n));
  prev.onclick = () => shift(-1);
  next.onclick = () => shift(1);
  todayBtn.onclick = () => goto(today);
  input.onchange = () => { if (input.value) goto(input.value); };

  render();
  return c;
}

let _tableSort = { col: "rate", dir: 1 };
function pageKelime(st) {
  const root = el("div", "grid");

  const types = Object.entries(st.word_types || {}).sort((a, b) => b[1] - a[1]);
  const tyLabels = types.map(t => t[0]), tyVals = types.map(t => t[1]);
  const tCard = card("Kelime Türleri", "");
  plot(tCard, (w, h) => columnChart({ width: w, avail: h, labels: tyLabels, series: [{ name: "Adet", color: C.blue, values: tyVals }] }),
       { columns: ["Tür", "Adet"], rows: seriesRows(tyLabels, [{ values: tyVals }]) });
  root.appendChild(gcol(12, tCard));

  const wCard = card("Tüm Kelimeler", `${st.started_count} başlanan · sütun başlığına dokunarak sırala`);
  const cols = [["word", "Kelime", 0], ["rate", "Başarı", 1], ["correct", "✓", 1], ["wrong", "✗", 1], ["blank", "∅", 1], ["repetitions", "Tekrar", 1], ["interval", "Aralık", 1], ["next", "Sonraki tekrar", 0]];
  const wrap = el("div", "table-wrap");
  const table = el("table"), thead = el("thead"), htr = el("tr");
  cols.forEach(([key, label, isNum]) => {
    const th = txt("th", "sortable" + (isNum ? " num" : ""), label);
    th.onclick = () => { _tableSort.dir = (_tableSort.col === key) ? -_tableSort.dir : 1; _tableSort.col = key; render(); };
    htr.appendChild(th);
  });
  thead.appendChild(htr); table.appendChild(thead);
  const tbody = el("tbody"); table.appendChild(tbody); wrap.appendChild(table);
  wCard._body.appendChild(wrap); root.appendChild(gcol(12, wCard));

  const rows = (st.table_rows || []).slice(), today = st.today;
  function render() {
    const k = _tableSort.col, d = _tableSort.dir;
    rows.sort((a, b) => { const x = a[k], y = b[k]; if (typeof x === "string" || typeof y === "string") return String(x || "").localeCompare(String(y || ""), "tr") * d; return (num(x) - num(y)) * d; });
    tbody.replaceChildren();
    for (const e of rows) {
      const tr = el("tr"), rc = rateColor(num(e.rate));
      tr.appendChild(txt("td", null, e.word)).style.fontWeight = 700;
      const rateTd = el("td", "num");
      if (e.total) { const p = txt("span", "pill", "%" + Math.round(num(e.rate))); p.style.color = rc; p.style.background = "rgba(255,255,255,.05)"; rateTd.appendChild(p); } else rateTd.textContent = "—";
      tr.appendChild(rateTd);
      tr.appendChild(txt("td", "num", num(e.correct))).style.color = C.green;
      tr.appendChild(txt("td", "num", num(e.wrong))).style.color = C.red;
      tr.appendChild(txt("td", "num", num(e.blank))).style.color = C.yellow;
      tr.appendChild(txt("td", "num", num(e.repetitions)));
      tr.appendChild(txt("td", "num", num(e.interval) + "g"));
      const nx = el("td");
      if (e.next) { const delta = Math.round((new Date(e.next) - new Date(today)) / 86400000); const c = txt("span", null, `${e.next} (${delta >= 0 ? "+" : ""}${delta}g)`); c.style.color = delta <= 0 ? C.red : C.muted; nx.appendChild(c); } else nx.textContent = "—";
      tr.appendChild(nx);
      tbody.appendChild(tr);
    }
  }
  render();
  return root;
}

    const add = (k, v) => { kv.appendChild(txt("div", "k", k)); kv.appendChild(txt("div", "v", v)); };
    add("Ortalama kolaylık (EF)", avg(eases).toFixed(2));
    add("En düşük / yüksek EF", `${Math.min(...eases).toFixed(2)} / ${Math.max(...eases).toFixed(2)}`);
    add("Ortalama aralık", `${Math.round(avg(intervals))} gün`);
    if (st.longest) {
      kv.appendChild(txt("div", "k", "En uzun aralık"));
      const d = el("div", "v");
      d.appendChild(txt("span", null, st.longest.word + " "));
      const g = txt("span", null, `(${st.longest.interval} gün)`); g.style.color = C.green;
      d.appendChild(g); kv.appendChild(d);
    }
    sCard._body.appendChild(kv);
    sCard._body.appendChild(txt("p", "note", "EF: 1.30 en zor, 2.50 varsayılan."));
  } else { sCard._body.appendChild(el("div", "empty", "Henüz çalışılmış kelime yok.")); }
  root.appendChild(gcol(4, sCard));

  return root;
}

const PAGES = {
  genel: ["📊 Genel Bakış", pageGenel],
  kredi: ["💰 Krediler", pageKredi],
  hafta: ["📅 Haftalık & Günlük", pageHafta],
  kelime: ["🔤 Kelimeler", pageKelime],
  gelecek: ["🔮 Gelecek & SM-2", pageGelecek],
};
let _active = "genel";
function buildTabs() {
  const t = document.getElementById("tabs"); t.replaceChildren();
  Object.entries(PAGES).forEach(([key, [label]]) => {
    const b = txt("button", "tab" + (key === _active ? " active" : ""), label);
    b.dataset.key = key;
    b.onclick = () => { _active = key; showPage(); b.scrollIntoView({ block: "nearest", inline: "nearest" }); };
    t.appendChild(b);
  });
}
function showPage() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.key === _active));
  document.querySelectorAll("section.page").forEach(sec => sec.classList.toggle("active", sec.dataset.page === _active));
  hideTip();
}
function renderAll(stats) {
  _ro.disconnect();   // drop observers on the nodes we are about to replace
  hideTip();
  Object.entries(PAGES).forEach(([key, [, builder]]) => {
    const sec = document.querySelector(`section.page[data-page="${key}"]`);
    sec.replaceChildren();
    try { sec.appendChild(builder(stats)); }
    catch (err) { sec.appendChild(el("div", "empty", "Bu sekme çizilemedi: " + err.message)); console.error(err); }
  });
  buildTabs(); showPage();
}

// ---------- data ----------
async function loadUsers() { const r = await fetch("/api/users"); return (await r.json()).users || []; }
async function loadStats(u) { const r = await fetch("/api/stats" + (u ? "?user=" + encodeURIComponent(u) : "")); if (!r.ok) throw new Error((await r.json()).error || r.statusText); return r.json(); }
function timeAgo(iso) { if (!iso) return ""; const secs = Math.round((Date.now() - new Date(iso).getTime()) / 1000); if (secs < 60) return "az önce"; if (secs < 3600) return Math.floor(secs / 60) + " dk önce"; if (secs < 86400) return Math.floor(secs / 3600) + " saat önce"; return new Date(iso).toLocaleString("tr-TR"); }

let _loaded = false;
async function refresh() {
  const banner = document.getElementById("banner-msg"), content = document.getElementById("content"), sel = document.getElementById("user");
  if (_loaded) content.classList.add("stale");   // hold the old render, dimmed
  try {
    const users = await loadUsers();
    if (!users.length) { content.style.display = "none"; banner.style.display = "block"; banner.textContent = "Henüz veri yok. Çocuğun uygulaması menüyü açtığında istatistikler burada görünecek."; return; }
    const prev = sel.value; sel.replaceChildren();
    users.forEach(u => { const o = txt("option", null, u.username); o.value = u.username; sel.appendChild(o); });
    if (prev && users.some(u => u.username === prev)) sel.value = prev;
    const rec = await loadStats(sel.value);
    const up = document.getElementById("updated"); up.replaceChildren();
    up.appendChild(el("span", "dot")); up.appendChild(txt("span", null, "Güncellendi: " + timeAgo(rec.updated_at)));
    banner.style.display = "none"; content.style.display = "block";
    renderAll(rec.stats || {});
    _loaded = true;
  } catch (err) {
    content.style.display = "none"; banner.style.display = "block";
    banner.textContent = "Yüklenemedi: " + err.message;
  } finally {
    content.classList.remove("stale");
  }
}
// Logo = home. A plain click returns to the default tab without a full reload;
// ctrl/cmd/middle-click still opens "/" the way any link would.
document.querySelector(".brand").addEventListener("click", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
  ev.preventDefault();
  _active = Object.keys(PAGES)[0];
  showPage();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("refresh").onclick = refresh;
document.getElementById("user").onchange = refresh;
refresh();
setInterval(refresh, 30000);
</script>
